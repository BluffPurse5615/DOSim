name: DOSim CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dosim-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK and run Android Lint
        run: gradle --no-daemon --stacktrace :launcher:assembleDebug :launcher:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: DOSim-debug-apk
          path: launcher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android Lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DOSim-lint-report
          path: launcher/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
          
