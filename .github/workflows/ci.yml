
name: DOSim CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dosim-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Build Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'

      # Recuperar la firma personalizada para Debug.
      - name: Restore custom Debug signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          values=(
            "$SIGNING_KEY_BASE64"
            "$KEY_STORE_PASSWORD"
            "$KEY_ALIAS"
            "$KEY_PASSWORD"
          )

          configured=0
          missing=0

          for value in "${values[@]}"; do
            if [ -n "$value" ]; then
              configured=$((configured + 1))
            else
              missing=$((missing + 1))
            fi
          done

          if [ "$configured" -eq 0 ]; then
            echo "::warning::Custom signing secrets are not configured. Using the standard Android Debug key."
            exit 0
          fi

          if [ "$missing" -ne 0 ]; then
            echo "::error::Custom signing is partially configured. Add all four signing secrets."
            exit 1
          fi

          key_file="$RUNNER_TEMP/dosim-signing.jks"

          printf '%s' "$SIGNING_KEY_BASE64" |
            base64 --decode > "$key_file"

          test -s "$key_file"

          {
            echo "SIGNING_STORE_FILE=$key_file"
            echo "KEY_STORE_PASSWORD=$KEY_STORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # Compilar APK Debug y ejecutar Lint.
      - name: Build debug APK and run Android Lint
        env:
          COMPANION_CERT: ${{ secrets.COMPANION_CERT }}
        run: |
          gradle --no-daemon --stacktrace \
            :launcher:assembleDebug \
            :launcher:lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: DOSim-debug-apk
          path: launcher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android Lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DOSim-lint-report
          path: launcher/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
